<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="青稞 PDF 资料库，集中浏览、预览和下载仓库中的 PDF 文档。"
    />
    <title>青稞 PDF 资料库</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23176b4a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial' font-size='25' font-weight='700' fill='white'%3EQK%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --paper: #f3f0e9;
        --surface: #fffdf8;
        --surface-strong: #ffffff;
        --ink: #17231e;
        --muted: #68736d;
        --line: #d9d5ca;
        --line-strong: #c8c2b5;
        --accent: #176b4a;
        --accent-strong: #0e5438;
        --accent-soft: #dceee5;
        --highlight: #b9572c;
        --navy: #244557;
        --shadow: 0 20px 55px rgb(23 35 30 / 10%);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--paper);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(90deg, rgb(255 255 255 / 36%), transparent 30%),
          var(--paper);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      iframe:focus-visible {
        outline: 3px solid rgb(23 107 74 / 26%);
        outline-offset: 2px;
      }

      [hidden] {
        display: none !important;
      }

      .site-header {
        position: sticky;
        z-index: 20;
        top: 0;
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 12px clamp(18px, 4vw, 56px);
        border-bottom: 1px solid var(--line);
        background: rgb(243 240 233 / 91%);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        place-items: center;
        border-radius: var(--radius);
        color: #fff;
        background: var(--accent);
        font-size: 13px;
        font-weight: 800;
      }

      .brand-title {
        margin: 0;
        font-size: clamp(18px, 2.1vw, 24px);
        font-weight: 750;
        line-height: 1.15;
      }

      .brand-subtitle {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .repository-link {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        color: var(--ink);
        background: var(--surface);
        font-size: 13px;
        font-weight: 650;
        text-decoration: none;
        transition:
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .repository-link:hover {
        border-color: var(--accent);
        color: var(--accent-strong);
        transform: translateY(-1px);
      }

      .repository-link svg {
        width: 17px;
        height: 17px;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .catalog-shell {
        width: min(100%, 1440px);
        margin: 0 auto;
        padding: 34px clamp(18px, 4vw, 56px) 64px;
      }

      .catalog-toolbar {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) auto;
        gap: 18px;
        align-items: end;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      .catalog-heading {
        min-width: 0;
      }

      .catalog-kicker {
        margin: 0 0 7px;
        color: var(--accent-strong);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .catalog-title {
        margin: 0;
        font-size: clamp(26px, 4vw, 42px);
        font-weight: 780;
        line-height: 1.12;
      }

      .catalog-summary {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 11px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .catalog-summary strong {
        color: var(--ink);
        font-size: 16px;
      }

      .sync-state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .sync-state::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
      }

      .catalog-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .search-field {
        position: relative;
        display: block;
        width: min(360px, 34vw);
      }

      .search-field > svg {
        position: absolute;
        top: 50%;
        left: 14px;
        width: 18px;
        height: 18px;
        color: var(--muted);
        transform: translateY(-50%);
        pointer-events: none;
      }

      .search-field input {
        width: 100%;
        height: 46px;
        padding: 0 42px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        color: var(--ink);
        background: var(--surface-strong);
        outline: none;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .search-field input::placeholder {
        color: #87908b;
      }

      .search-field input::-webkit-search-cancel-button {
        display: none;
      }

      .search-field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgb(23 107 74 / 11%);
      }

      .search-clear {
        position: absolute;
        top: 50%;
        right: 9px;
        display: none;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        transform: translateY(-50%);
      }

      .search-clear:hover {
        color: var(--ink);
        background: #eee9df;
      }

      .search-field.has-value .search-clear {
        display: grid;
      }

      .search-clear svg {
        width: 16px;
        height: 16px;
      }

      .sort-select {
        height: 46px;
        padding: 0 34px 0 13px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        color: var(--muted);
        background: var(--surface);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .filter-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 0 20px;
      }

      .segmented {
        display: inline-flex;
        flex-wrap: wrap;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #ebe7de;
      }

      .topic-filter {
        min-width: 62px;
        height: 33px;
        padding: 0 12px;
        border: 0;
        border-radius: 5px;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .topic-filter[aria-pressed="true"] {
        color: var(--ink);
        background: var(--surface-strong);
        box-shadow: 0 1px 4px rgb(23 35 30 / 10%);
      }

      .result-label {
        color: var(--muted);
        font-size: 12px;
      }

      .document-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 16px;
      }

      .document-card {
        position: relative;
        display: flex;
        min-height: 220px;
        flex-direction: column;
        align-items: flex-start;
        padding: 22px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        color: inherit;
        background: var(--surface);
        text-align: left;
        cursor: pointer;
        transition:
          border-color 170ms ease,
          box-shadow 170ms ease,
          transform 170ms ease;
      }

      .document-card::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: var(--highlight);
        content: "";
      }

      .document-card:hover {
        border-color: #b9b3a7;
        box-shadow: var(--shadow);
        transform: translateY(-3px);
      }

      .card-topline {
        display: flex;
        width: 100%;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 22px;
      }

      .document-icon {
        position: relative;
        display: grid;
        width: 46px;
        height: 54px;
        place-items: center;
        border-radius: 6px;
        color: #fff;
        background: var(--highlight);
        font-size: 10px;
        font-weight: 800;
      }

      .document-icon::after {
        position: absolute;
        top: 0;
        right: 0;
        width: 13px;
        height: 13px;
        border-bottom-left-radius: 4px;
        background: rgb(255 255 255 / 28%);
        content: "";
      }

      .card-tags {
        display: flex;
        width: 100%;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }

      .topic-badge {
        padding: 4px 7px;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--accent-strong);
        background: var(--accent-soft);
        font-size: 10px;
        font-weight: 750;
        line-height: 1.2;
      }

      .document-title {
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        font-size: 17px;
        font-weight: 750;
        line-height: 1.4;
        overflow-wrap: anywhere;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .document-file {
        width: 100%;
        margin: 9px 0 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-footer {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: auto;
        padding-top: 18px;
        color: var(--muted);
        font-size: 11px;
      }

      .read-action {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--accent-strong);
        font-weight: 750;
      }

      .read-action svg {
        width: 15px;
        height: 15px;
        transition: transform 170ms ease;
      }

      .document-card:hover .read-action svg {
        transform: translateX(3px);
      }

      .empty-state {
        grid-column: 1 / -1;
        display: grid;
        min-height: 280px;
        place-items: center;
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        color: var(--muted);
        text-align: center;
      }

      .empty-state strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 15px;
      }

      .empty-state p {
        margin: 0;
        font-size: 12px;
      }

      .viewer-dialog {
        width: min(1240px, calc(100vw - 36px));
        max-width: none;
        height: min(900px, calc(100dvh - 36px));
        max-height: none;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        color: var(--ink);
        background: var(--surface);
        box-shadow: 0 28px 90px rgb(12 21 17 / 30%);
      }

      .viewer-dialog::backdrop {
        background: rgb(16 24 21 / 66%);
        backdrop-filter: blur(4px);
      }

      .viewer-shell {
        display: flex;
        height: 100%;
        min-height: 0;
        flex-direction: column;
      }

      .viewer-toolbar {
        display: flex;
        min-height: 74px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 12px 16px 12px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .viewer-copy {
        min-width: 0;
      }

      .viewer-title {
        margin: 0;
        overflow: hidden;
        font-size: 17px;
        font-weight: 750;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .viewer-path {
        margin: 4px 0 0;
        overflow: hidden;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .viewer-actions {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 8px;
      }

      .action-button {
        display: inline-grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        text-decoration: none;
        transition:
          border-color 150ms ease,
          color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .action-button:hover {
        border-color: var(--accent);
        color: var(--accent-strong);
        background: var(--accent-soft);
        transform: translateY(-1px);
      }

      .action-button svg {
        width: 18px;
        height: 18px;
      }

      .viewer-frame {
        position: relative;
        min-height: 0;
        flex: 1;
        overflow: hidden;
        background: #e7e3da;
      }

      .viewer-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      .viewer-loader {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        background: #f1eee7;
        font-size: 12px;
        transition: opacity 180ms ease;
      }

      .viewer-loader::before {
        width: 28px;
        height: 28px;
        border: 3px solid #d6d1c7;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
        content: "";
      }

      .viewer-loader span {
        position: absolute;
        margin-top: 58px;
      }

      .viewer-frame.is-ready .viewer-loader {
        opacity: 0;
        pointer-events: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
        white-space: nowrap;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 880px) {
        .site-header {
          min-height: 64px;
          padding: 10px 16px;
        }

        .brand-mark {
          width: 38px;
          height: 38px;
          flex-basis: 38px;
        }

        .brand-subtitle,
        .repository-link span {
          display: none;
        }

        .repository-link {
          width: 40px;
          justify-content: center;
          padding: 0;
        }

        .catalog-shell {
          padding: 26px 16px 48px;
        }

        .catalog-toolbar {
          grid-template-columns: 1fr;
          align-items: stretch;
        }

        .catalog-controls {
          align-items: stretch;
          flex-direction: column;
        }

        .search-field {
          width: 100%;
        }

        .sort-select {
          width: 100%;
        }

        .filter-bar {
          align-items: flex-start;
          flex-direction: column;
        }

        .document-grid {
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }

        .viewer-dialog {
          width: calc(100vw - 16px);
          height: calc(100dvh - 16px);
        }
      }

      @media (max-width: 520px) {
        .catalog-title {
          font-size: 28px;
        }

        .document-grid {
          grid-template-columns: 1fr;
        }

        .document-card {
          min-height: 204px;
        }

        .viewer-toolbar {
          min-height: 108px;
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
          padding: 12px;
        }

        .viewer-actions {
          width: 100%;
        }

        .action-button {
          flex: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">QK</div>
        <div>
          <h1 class="brand-title">青稞 PDF 资料库</h1>
          <p class="brand-subtitle">青稞社区资料索引</p>
        </div>
      </div>
      <div class="header-actions">
        <a
          class="repository-link"
          href="https://qingkelab.github.io/"
          target="_blank"
          rel="noreferrer"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <path d="M9 22V12h6v10"></path>
          </svg>
          <span>青稞社区</span>
        </a>
        <a
          class="repository-link"
          href="https://github.com/qingkelab/ppt"
          target="_blank"
          rel="noreferrer"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7.4a5.8 5.8 0 0 0-1.6-4 5.4 5.4 0 0 0-.1-4S17.8-1.2 15 1a13.4 13.4 0 0 0-7 0C5.2-1.2 3.9-.9 3.9-.9a5.4 5.4 0 0 0-.1 4A5.8 5.8 0 0 0 2.2 7c0 5.8 3.5 7 6.8 7.4A4.8 4.8 0 0 0 8 18v4"></path>
            <path d="M8 19c-3 .9-3-1.5-4-2"></path>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </header>

    <main class="catalog-shell">
      <section class="catalog-toolbar" aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <p class="catalog-kicker">Document library</p>
          <h2 class="catalog-title" id="catalog-title">资料目录</h2>
          <p class="catalog-summary">
            <strong id="document-count">0</strong>
            <span>份 PDF</span>
            <span class="sync-state" id="sync-state">正在同步</span>
          </p>
        </div>

        <div class="catalog-controls">
          <label class="search-field" id="search-field">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <span class="sr-only">搜索 PDF</span>
            <input id="search-input" type="search" placeholder="搜索 PDF" autocomplete="off" />
            <button class="search-clear" id="search-clear" type="button" aria-label="清空搜索">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
          </label>

          <label>
            <span class="sr-only">排序方式</span>
            <select class="sort-select" id="sort-select">
              <option value="name">名称排序</option>
              <option value="size">大小排序</option>
              <option value="path">路径排序</option>
            </select>
          </label>
        </div>
      </section>

      <section class="filter-bar" aria-label="资料筛选">
        <div class="segmented" aria-label="按技术主题筛选">
          <button class="topic-filter" type="button" data-topic="all" aria-pressed="true">
            全部
          </button>
          <button class="topic-filter" type="button" data-topic="LLM Infra" aria-pressed="false">
            LLM Infra
          </button>
          <button class="topic-filter" type="button" data-topic="RL" aria-pressed="false">
            RL
          </button>
          <button class="topic-filter" type="button" data-topic="Agent" aria-pressed="false">
            Agent
          </button>
          <button class="topic-filter" type="button" data-topic="LLM" aria-pressed="false">
            LLM
          </button>
          <button class="topic-filter" type="button" data-topic="Training" aria-pressed="false">
            Training
          </button>
          <button class="topic-filter" type="button" data-topic="Inference" aria-pressed="false">
            Inference
          </button>
          <button class="topic-filter" type="button" data-topic="Distributed" aria-pressed="false">
            Distributed
          </button>
          <button class="topic-filter" type="button" data-topic="Attention" aria-pressed="false">
            Attention
          </button>
          <button class="topic-filter" type="button" data-topic="KV Cache" aria-pressed="false">
            KV Cache
          </button>
          <button
            class="topic-filter"
            type="button"
            data-topic="Model Architecture"
            aria-pressed="false"
          >
            Model Architecture
          </button>
          <button class="topic-filter" type="button" data-topic="World Model" aria-pressed="false">
            World Model
          </button>
        </div>
        <span class="result-label" id="result-label">0 项结果</span>
      </section>

      <section
        class="document-grid"
        id="document-grid"
        aria-label="PDF 资料"
        aria-live="polite"
      ></section>
    </main>

    <dialog class="viewer-dialog" id="viewer-dialog" aria-labelledby="viewer-title">
      <div class="viewer-shell">
        <div class="viewer-toolbar">
          <div class="viewer-copy">
            <h2 class="viewer-title" id="viewer-title">PDF</h2>
            <p class="viewer-path" id="viewer-path"></p>
          </div>
          <div class="viewer-actions">
            <a
              class="action-button"
              id="open-button"
              href="#"
              target="_blank"
              rel="noreferrer"
              aria-label="在新窗口打开"
              title="在新窗口打开"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M15 3h6v6"></path>
                <path d="M10 14 21 3"></path>
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              </svg>
            </a>
            <a
              class="action-button"
              id="download-button"
              href="#"
              download
              aria-label="下载 PDF"
              title="下载 PDF"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <path d="m7 10 5 5 5-5"></path>
                <path d="M12 15V3"></path>
              </svg>
            </a>
            <button
              class="action-button"
              id="close-button"
              type="button"
              aria-label="关闭预览"
              title="关闭预览"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="viewer-frame" id="viewer-frame">
          <div class="viewer-loader" aria-hidden="true">
            <span>正在载入</span>
          </div>
          <iframe id="pdf-viewer" title="PDF 预览"></iframe>
        </div>
      </div>
    </dialog>

    <script>
      const repository = "qingkelab/ppt";
      const apiUrl = `https://api.github.com/repos/${repository}/git/trees/main?recursive=1`;
      const fallbackDocuments = [
        {
          path: "pdf/The_Ultra-Scale_Playbook_Training_LLMs_on_GPU_Clusters.pdf",
          size: 14059172,
        },
        {
          path: "pdf/ML-Machine-Learning-Engineering.pdf",
          size: 9303619,
        },
        {
          path: "pdf/Understanding_Attention_Handbook_01.pdf",
          size: 538180,
        },
        {
          path: "pdf/Understanding_KV_Cache_Handbook_02.pdf",
          size: 462678,
        },
        {
          path: "pdf/中文-oai_gpt-oss_model_card.pdf",
          size: 8471498,
        },
      ];

      const externalDocuments = [
        {
          path: "external/Purshow_Notes/Beyond_Residual_CN.pdf",
          size: 2361697,
          title: "Beyond Residual（中文版）",
          sourceLabel: "Purshow/Purshow_Notes · Beyond_Residual/CN/Beyond_Residual_CN.pdf",
          sourceUrl:
            "https://github.com/Purshow/Purshow_Notes/blob/main/Beyond_Residual/CN/Beyond_Residual_CN.pdf",
          downloadUrl:
            "https://raw.githubusercontent.com/Purshow/Purshow_Notes/main/Beyond_Residual/CN/Beyond_Residual_CN.pdf",
          viewerUrl:
            "https://mozilla.github.io/pdf.js/web/viewer.html?file=" +
            encodeURIComponent(
              "https://raw.githubusercontent.com/Purshow/Purshow_Notes/main/Beyond_Residual/CN/Beyond_Residual_CN.pdf",
            ),
        },
        {
          path: "external/ai-infra-book/AI-Infra-Book.pdf",
          size: 7991178,
          title: "深入理解 AI Infra：量化分析与系统设计",
          sourceLabel: "bojieli/ai-infra-book · AI-Infra-Book.pdf",
          sourceUrl: "https://github.com/bojieli/ai-infra-book/releases/latest",
          downloadUrl:
            "https://github.com/bojieli/ai-infra-book/releases/latest/download/AI-Infra-Book.pdf",
          viewerUrl: "https://bojieli.github.io/ai-infra-book/",
        },
        {
          path: "external/Purshow_Notes/WAM_CN.pdf",
          size: 8940425,
          title: "WAM（中文版）",
          sourceLabel: "Purshow/Purshow_Notes · WAM/CN/WAM_CN.pdf",
          sourceUrl:
            "https://github.com/Purshow/Purshow_Notes/blob/main/WAM/CN/WAM_CN.pdf",
          downloadUrl:
            "https://raw.githubusercontent.com/Purshow/Purshow_Notes/main/WAM/CN/WAM_CN.pdf",
          viewerUrl:
            "https://mozilla.github.io/pdf.js/web/viewer.html?file=" +
            encodeURIComponent(
              "https://raw.githubusercontent.com/Purshow/Purshow_Notes/main/WAM/CN/WAM_CN.pdf",
            ),
        },
        {
          path: "external/ai-agent-book/AI-Agents-in-Depth-zh-CN.pdf",
          size: 11063163,
          title: "深入理解 AI Agent：设计原理与工程实践",
          sourceLabel: "bojieli/ai-agent-book · AI-Agents-in-Depth-zh-CN.pdf",
          sourceUrl: "https://github.com/bojieli/ai-agent-book/releases/tag/latest",
          downloadUrl:
            "https://github.com/bojieli/ai-agent-book/releases/download/latest/AI-Agents-in-Depth-zh-CN.pdf",
          viewerUrl: "https://bojieli.github.io/ai-agent-book/",
        },
      ];

      const knownTitles = new Map([
        [
          "pdf/The_Ultra-Scale_Playbook_Training_LLMs_on_GPU_Clusters.pdf",
          "The Ultra-Scale Playbook: Training LLMs on GPU Clusters",
        ],
        [
          "pdf/ML-Machine-Learning-Engineering.pdf",
          "Machine Learning: LLM/VLM Training and Engineering",
        ],
        [
          "pdf/Understanding_Attention_Handbook_01.pdf",
          "Understanding Attention Handbook 01",
        ],
        [
          "pdf/Understanding_KV_Cache_Handbook_02.pdf",
          "Understanding KV Cache Handbook 02",
        ],
        ["pdf/中文-oai_gpt-oss_model_card.pdf", "OpenAI GPT-OSS 模型卡（中文）"],
      ]);

      const topicTags = new Map([
        ["pdf/meetup/llm-infra/KTransformers.pdf", ["LLM Infra", "Inference"]],
        ["pdf/meetup/llm-infra/LightLLM.pdf", ["LLM Infra", "Inference"]],
        ["pdf/meetup/llm-infra/Ritual.pdf", ["LLM Infra", "Distributed"]],
        ["pdf/meetup/llm-infra/SGLang.pdf", ["LLM Infra", "Inference"]],
        ["pdf/meetup/llm-infra/TRTLLM.pdf", ["LLM Infra", "Inference"]],
        ["pdf/meetup/llm-infra/vllm.pdf", ["LLM Infra", "Inference"]],
        ["pdf/meetup/rl-infra/AReaL.pdf", ["RL", "Training", "Distributed"]],
        ["pdf/meetup/rl-infra/echo.pdf", ["RL", "Training", "Distributed"]],
        ["pdf/meetup/rl-infra/Entropy.pdf", ["RL", "Training"]],
        ["pdf/meetup/rl-infra/OpenRLHF.pdf", ["RL", "Training"]],
        ["pdf/meetup/rl-infra/RLite.pdf", ["RL", "Training"]],
        ["pdf/meetup/rl-infra/ROLL.pdf", ["RL", "Training", "Distributed"]],
        ["pdf/meetup/rl-infra/verl.pdf", ["RL", "Training", "Distributed"]],
        [
          "pdf/The_Ultra-Scale_Playbook_Training_LLMs_on_GPU_Clusters.pdf",
          ["LLM", "Training", "Distributed"],
        ],
        [
          "pdf/ML-Machine-Learning-Engineering.pdf",
          ["LLM", "Training", "Inference"],
        ],
        [
          "pdf/Understanding_Attention_Handbook_01.pdf",
          ["Attention", "Model Architecture"],
        ],
        ["pdf/Understanding_KV_Cache_Handbook_02.pdf", ["LLM Infra", "KV Cache", "Inference"]],
        [
          "pdf/中文-oai_gpt-oss_model_card.pdf",
          ["LLM", "Model Architecture"],
        ],
        [
          "external/Purshow_Notes/Beyond_Residual_CN.pdf",
          ["Model Architecture", "Training"],
        ],
        [
          "external/ai-infra-book/AI-Infra-Book.pdf",
          ["LLM Infra", "Training", "Inference", "Distributed"],
        ],
        ["external/Purshow_Notes/WAM_CN.pdf", ["Agent", "World Model"]],
        [
          "external/ai-agent-book/AI-Agents-in-Depth-zh-CN.pdf",
          ["Agent", "LLM"],
        ],
      ]);

      const state = {
        documents: [],
        filtered: [],
        selectedPath: "",
        topic: "all",
        query: "",
        sort: "name",
      };

      const elements = {
        documentGrid: document.querySelector("#document-grid"),
        documentCount: document.querySelector("#document-count"),
        resultLabel: document.querySelector("#result-label"),
        syncState: document.querySelector("#sync-state"),
        searchField: document.querySelector("#search-field"),
        searchInput: document.querySelector("#search-input"),
        searchClear: document.querySelector("#search-clear"),
        sortSelect: document.querySelector("#sort-select"),
        viewerDialog: document.querySelector("#viewer-dialog"),
        viewerFrame: document.querySelector("#viewer-frame"),
        viewerTitle: document.querySelector("#viewer-title"),
        viewerPath: document.querySelector("#viewer-path"),
        pdfViewer: document.querySelector("#pdf-viewer"),
        openButton: document.querySelector("#open-button"),
        downloadButton: document.querySelector("#download-button"),
        closeButton: document.querySelector("#close-button"),
      };

      function pathForBrowser(path) {
        return path.split("/").map(encodeURIComponent).join("/");
      }

      function fileTitle(path) {
        if (knownTitles.has(path)) {
          return knownTitles.get(path);
        }

        const name = path.split("/").pop().replace(/\.pdf$/i, "");
        return name.replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
      }

      function documentTopics(path) {
        if (topicTags.has(path)) {
          return topicTags.get(path);
        }

        if (path.startsWith("pdf/meetup/llm-infra/")) {
          return ["LLM Infra"];
        }

        if (path.startsWith("pdf/meetup/rl-infra/")) {
          return ["RL"];
        }

        return [];
      }

      function formatSize(bytes) {
        if (!Number.isFinite(bytes) || bytes <= 0) {
          return "PDF";
        }

        if (bytes < 1024 * 1024) {
          return `${Math.max(1, Math.round(bytes / 1024))} KB`;
        }

        return `${(bytes / 1024 / 1024).toFixed(bytes >= 10 * 1024 * 1024 ? 0 : 1)} MB`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function normalizeDocument(item) {
        const title = item.title || fileTitle(item.path);
        const tags = item.tags || documentTopics(item.path);
        return {
          path: item.path,
          size: item.size,
          title,
          tags,
          downloadUrl: item.downloadUrl || "",
          viewerUrl: item.viewerUrl || "",
          sourceUrl: item.sourceUrl || "",
          sourceLabel: item.sourceLabel || item.path,
          searchText: `${title} ${item.path} ${tags.join(" ")}`.toLocaleLowerCase("zh-CN"),
        };
      }

      function sortDocuments(documents) {
        const collator = new Intl.Collator("zh-CN", {
          numeric: true,
          sensitivity: "base",
        });

        return [...documents].sort((a, b) => {
          if (state.sort === "size") {
            return b.size - a.size;
          }

          if (state.sort === "path") {
            return collator.compare(a.path, b.path);
          }

          return collator.compare(a.title, b.title);
        });
      }

      function applyFilters() {
        const query = state.query.trim().toLocaleLowerCase("zh-CN");
        const filtered = state.documents.filter((document) => {
          const topicMatches =
            state.topic === "all" || document.tags.includes(state.topic);

          return topicMatches && (!query || document.searchText.includes(query));
        });

        state.filtered = sortDocuments(filtered);
        renderDocumentGrid();
      }

      function renderDocumentGrid() {
        elements.documentCount.textContent = String(state.filtered.length);
        elements.resultLabel.textContent = `${state.filtered.length} 项结果`;

        if (!state.filtered.length) {
          elements.documentGrid.innerHTML = `
            <div class="empty-state">
              <div>
                <strong>没有匹配的资料</strong>
                <p>调整搜索内容或技术主题</p>
              </div>
            </div>`;
          return;
        }

        elements.documentGrid.innerHTML = state.filtered
          .map((document) => {
            const fileName = document.path.split("/").pop();
            const tags = document.tags
              .map((tag) => `<span class="topic-badge">${escapeHtml(tag)}</span>`)
              .join("");
            return `
              <button
                class="document-card"
                type="button"
                data-path="${escapeHtml(document.path)}"
                aria-label="查看 ${escapeHtml(document.title)}"
              >
                <span class="card-topline">
                  <span class="document-icon" aria-hidden="true">PDF</span>
                </span>
                <span class="document-title">${escapeHtml(document.title)}</span>
                <span class="document-file" title="${escapeHtml(fileName)}">${escapeHtml(fileName)}</span>
                <span class="card-tags" aria-label="技术主题">${tags}</span>
                <span class="card-footer">
                  <span>${formatSize(document.size)}</span>
                  <span class="read-action">
                    查看
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M5 12h14"></path>
                      <path d="m13 6 6 6-6 6"></path>
                    </svg>
                  </span>
                </span>
              </button>`;
          })
          .join("");
      }

      function findDocument(path) {
        return state.documents.find((document) => document.path === path);
      }

      function openDocument(path) {
        const document = findDocument(path);
        if (!document) {
          return;
        }

        state.selectedPath = path;
        const documentUrl = document.downloadUrl || pathForBrowser(path);
        elements.viewerTitle.textContent = document.title;
        elements.viewerPath.textContent =
          `${document.sourceLabel} · ${formatSize(document.size)}`;
        elements.openButton.href = document.sourceUrl || documentUrl;
        elements.downloadButton.href = documentUrl;
        elements.viewerFrame.classList.remove("is-ready");
        elements.pdfViewer.src =
          document.viewerUrl || `${documentUrl}#view=FitH`;

        if (!elements.viewerDialog.open) {
          elements.viewerDialog.showModal();
        }

        const url = new URL(window.location.href);
        url.searchParams.set("file", path);
        history.replaceState(null, "", url);
      }

      function closeDocument() {
        elements.viewerDialog.close();
      }

      function updateSearchState() {
        elements.searchField.classList.toggle("has-value", Boolean(elements.searchInput.value));
      }

      async function loadDocuments() {
        try {
          const response = await fetch(apiUrl, {
            headers: { Accept: "application/vnd.github+json" },
          });

          if (!response.ok) {
            throw new Error(`GitHub API ${response.status}`);
          }

          const payload = await response.json();
          const documents = payload.tree
            .filter(
              (item) =>
                item.type === "blob" &&
                item.path.toLowerCase().endsWith(".pdf") &&
                !item.path.split("/").some((part) => part.startsWith(".")),
            )
            .map(normalizeDocument);

          if (!documents.length) {
            throw new Error("No PDF documents found");
          }

          state.documents = [
            ...documents,
            ...externalDocuments.map(normalizeDocument),
          ];
          elements.syncState.textContent = "已同步 GitHub";
        } catch (error) {
          state.documents = [
            ...fallbackDocuments.map(normalizeDocument),
            ...externalDocuments.map(normalizeDocument),
          ];
          elements.syncState.textContent = "本地索引";
          console.warn("GitHub PDF index unavailable, using fallback data.", error);
        }

        applyFilters();
        const requestedPath = new URL(window.location.href).searchParams.get("file");
        if (requestedPath && findDocument(requestedPath)) {
          openDocument(requestedPath);
        }
      }

      elements.documentGrid.addEventListener("click", (event) => {
        const card = event.target.closest(".document-card");
        if (card) {
          openDocument(card.dataset.path);
        }
      });

      elements.searchInput.addEventListener("input", () => {
        state.query = elements.searchInput.value;
        updateSearchState();
        applyFilters();
      });

      elements.searchClear.addEventListener("click", () => {
        elements.searchInput.value = "";
        state.query = "";
        updateSearchState();
        applyFilters();
        elements.searchInput.focus();
      });

      document.querySelectorAll(".topic-filter").forEach((button) => {
        button.addEventListener("click", () => {
          state.topic = button.dataset.topic;
          document.querySelectorAll(".topic-filter").forEach((candidate) => {
            candidate.setAttribute(
              "aria-pressed",
              String(candidate.dataset.topic === state.topic),
            );
          });
          applyFilters();
        });
      });

      elements.sortSelect.addEventListener("change", () => {
        state.sort = elements.sortSelect.value;
        applyFilters();
      });

      elements.pdfViewer.addEventListener("load", () => {
        elements.viewerFrame.classList.add("is-ready");
      });

      elements.closeButton.addEventListener("click", closeDocument);

      elements.viewerDialog.addEventListener("click", (event) => {
        if (event.target === elements.viewerDialog) {
          closeDocument();
        }
      });

      elements.viewerDialog.addEventListener("close", () => {
        elements.pdfViewer.src = "about:blank";
        state.selectedPath = "";
        const url = new URL(window.location.href);
        url.searchParams.delete("file");
        history.replaceState(null, "", url);
      });

      loadDocuments();
    </script>
  </body>
</html>
