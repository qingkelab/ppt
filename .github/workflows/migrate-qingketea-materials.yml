name: Migrate QingkeTea materials

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ppt
        uses: actions/checkout@v5

      - name: Download QingkeTea materials on GitHub runner
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pdf/qingketea/20250824 pdf/qingketea/20250713

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 1200 \
            --speed-limit 1024 \
            --speed-time 60 \
            --parallel \
            --parallel-max 8 \
            --output "pdf/qingketea/20250824/verl.pdf" \
            "https://qingkeai.online/upload/pdf/20250824/verl.pdf" \
            --output "pdf/qingketea/20250824/ROLL.pdf" \
            "https://qingkeai.online/upload/pdf/20250824/ROLL.pdf" \
            --output "pdf/qingketea/20250824/Entropy.pdf" \
            "https://qingkeai.online/upload/pdf/20250824/Entropy.pdf" \
            --output "pdf/qingketea/20250824/echo.pdf" \
            "https://qingkeai.online/upload/pdf/20250824/echo.pdf" \
            --output "pdf/qingketea/20250824/AReaL.pdf" \
            "https://qingkeai.online/upload/pdf/20250824/AReaL.pdf" \
            --output "pdf/qingketea/20250824/RLite.pdf" \
            "https://qingkeai.online/upload/pdf/20250824/RLite.pdf" \
            --output "pdf/qingketea/20250824/OpenRLHF.pdf" \
            "https://qingkeai.online/upload/pdf/20250824/OpenRLHF.pdf" \
            --output "pdf/qingketea/20250713/KTransformers.pdf" \
            "https://qingkeai.online/upload/pdf/20250713/KTransformers.pdf" \
            --output "pdf/qingketea/20250713/LightLLM.pdf" \
            "https://qingkeai.online/upload/pdf/20250713/LightLLM.pdf" \
            --output "pdf/qingketea/20250713/vllm.pdf" \
            "https://qingkeai.online/upload/pdf/20250713/vllm.pdf" \
            --output "pdf/qingketea/20250713/Ritual.pdf" \
            "https://qingkeai.online/upload/pdf/20250713/Ritual.pdf" \
            --output "pdf/qingketea/20250713/TRTLLM.pdf" \
            "https://qingkeai.online/upload/pdf/20250713/TRTLLM.pdf" \
            --output "pdf/qingketea/20250713/SGLang.pdf" \
            "https://qingkeai.online/upload/pdf/20250713/SGLang.pdf"

          while IFS= read -r document; do
            if ! file "${document}" | grep -qi "PDF"; then
              echo "Not a PDF: ${document}" >&2
              exit 1
            fi
          done < <(find pdf/qingketea -type f -name '*.pdf' -print)

      - name: Commit migrated materials
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/qingketea

          if git diff --cached --quiet; then
            echo "No new materials to commit."
            exit 0
          fi

          git commit -m "content: migrate QingkeTea materials"
          git push
